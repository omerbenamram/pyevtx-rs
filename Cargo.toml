[package]
name = "evtx_py"
description = "Python bindings for https://github.com/omerbenamram/evtx"
version = "0.14.0"
authors = ["Omer Ben-Amram <omerbenamram@gmail.com>"]
edition = "2018"
license = "MIT/Apache-2.0"
readme = "README.md"

[lib]
name = "evtx"
crate-type = ["cdylib", "rlib"]

[dependencies]
# TODO: switch back to `version = "0.13.0"` once evtx 0.13.0 is on crates.io.
evtx_rs = { git = "https://github.com/omerbenamram/evtx", branch = "claude/project-thread-schqu1", default-features = false, features = [
    "multithreading",
], package = "evtx" }
encoding_rs = "0.8"
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }
pyo3-file = "0.18.0"
serde_json = "1"
bumpalo = "3"
pyo3-stub-gen = "0.23"

[features]
default = ["wevt_templates", "extension-module"]
wevt_templates = ["evtx_rs/wevt_templates"]
extension-module = ["pyo3/extension-module"]

[[bin]]
name = "stub_gen"
doc = false

# pyo3-stub-gen 0.23.1 caps pyo3 at < 0.30. vendor/pyo3-stub-gen is the 0.23.1
# crate with only that bound relaxed to < 0.31. Drop this once upstream ships
# pyo3 0.30 support.
[patch.crates-io]
pyo3-stub-gen = { path = "vendor/pyo3-stub-gen" }
