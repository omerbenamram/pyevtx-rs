[package]
name = "evtx_py"
description = "Python bindings for https://github.com/omerbenamram/evtx"
version = "0.15.0"
authors = ["Omer Ben-Amram <omerbenamram@gmail.com>"]
edition = "2018"
license = "MIT/Apache-2.0"
readme = "README.md"
# The sdist holds these paths and nothing else (maturin adds `pyproject.toml`): what a build
# and its tests need. A new tooling file stays out without a change here, and so does
# `rust-toolchain`, which would have rustup fetch a toolchain on the machine that builds.
# The patterns for `python/` and `tests/` name file types because Cargo does not apply
# `.gitignore` to an `include` list, and a local build leaves the compiled module and
# `__pycache__` there.
include = [
    "/src/",
    "/examples/",
    "/python/**/*.py",
    "/python/**/*.pyi",
    "/python/**/py.typed",
    "/tests/**/*.py",
    "/tests/fixtures/",
    "/samples/",
    "/scripts/",
    "/README.md",
    "/CHANGELOG.md",
]

[lib]
name = "evtx"
crate-type = ["cdylib", "rlib"]

[dependencies]
evtx_rs = { version = "0.15.1", default-features = false, features = [
    "multithreading",
], package = "evtx" }
encoding_rs = "0.8"
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }
pyo3-file = "0.18.0"
rayon = "1.12"
serde_json = "1"
bumpalo = "3"
pyo3-stub-gen = "0.23.2"

[features]
default = ["wevt_templates", "extension-module"]
wevt_templates = ["evtx_rs/wevt_templates"]
extension-module = ["pyo3/extension-module"]

[[bin]]
name = "stub_gen"
doc = false

