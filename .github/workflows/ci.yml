name: CI

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14t"]
    steps:
      - uses: actions/checkout@v6
      - name: Checkout Rust EVTX (for samples)
        uses: actions/checkout@v6
        with:
          repository: omerbenamram/evtx
          path: evtx-rs
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build instrumentation wheels
        uses: PyO3/maturin-action@v1
        with:
          version: "1.15.0"
          manylinux: auto
          command: build
          args: --release --locked -o dist --interpreter python${{ matrix.python }}
        env:
          RUSTFLAGS: "-Cprofile-generate=${{ github.workspace }}/pgo-data"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-unknown-linux-gnu
          components: llvm-tools
      - name: PGO optimize
        run: |
          PATH=$HOME/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/x86_64-unknown-linux-gnu/bin/:$PATH
          pip install --no-index --find-links ./dist evtx
          echo "Running instrumented binary"
          sudo mkdir -p $PWD/pgo-data
          sudo chmod -R 777 $PWD/pgo-data
          for i in $(find $PWD/evtx-rs/samples -name "*.evtx"); do
              echo "Processing $i"
              python scripts/evtx_dump.py $i 1>/dev/null
          done
          echo "Merging profile data"
          llvm-profdata merge -o $PWD/pgo-data/merged.profdata $PWD/pgo-data
      - uses: PyO3/maturin-action@v1
        with:
          version: "1.15.0"
          manylinux: auto
          command: build
          args: --release --locked -o dist --interpreter python${{ matrix.python }}
        env:
          RUSTFLAGS: "-Cprofile-use=${{ github.workspace }}/pgo-data/merged.profdata"
      - name: Verify wheel ABI
        run: python scripts/check_wheel_abi.py "${{ matrix.python }}"
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.python }}
          path: dist
      - run: pip install -U pytest
      - run: pip install --no-index --find-links ./dist evtx
      - run: pytest

  linux-arm64:
    runs-on: ubuntu-latest
    env:
      PYO3_CROSS_PYTHON_VERSION: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14t"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - uses: PyO3/maturin-action@v1
        with:
          version: "1.15.0"
          command: build
          args: --release --locked -o dist --interpreter python --zig --target aarch64-unknown-linux-gnu
      - name: Verify wheel ABI
        run: python scripts/check_wheel_abi.py "${{ matrix.python }}"
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-arm64-${{ matrix.python }}
          path: dist

  linux-aarch64-musl:
    runs-on: ubuntu-latest
    env:
      PYO3_CROSS_PYTHON_VERSION: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14t"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: PyO3/maturin-action@v1
        with:
          version: "1.15.0"
          command: build
          args: --release --locked -o dist --interpreter python --zig --target aarch64-unknown-linux-musl
      - name: Verify wheel ABI
        run: python scripts/check_wheel_abi.py "${{ matrix.python }}"
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-aarch64-musl-${{ matrix.python }}
          path: dist

  linux-x86_64-musl:
    runs-on: ubuntu-latest
    env:
      PYO3_CROSS_PYTHON_VERSION: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14t"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: PyO3/maturin-action@v1
        with:
          version: "1.15.0"
          command: build
          args: --release --locked -o dist --interpreter python --zig --target x86_64-unknown-linux-musl
      - name: Verify wheel ABI
        run: python scripts/check_wheel_abi.py "${{ matrix.python }}"
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-x86_64-musl-${{ matrix.python }}
          path: dist

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14t"]
    steps:
      - uses: actions/checkout@v6
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: Swatinem/rust-cache@v2
      - uses: PyO3/maturin-action@v1
        with:
          version: "1.15.0"
          command: build
          args: --release --locked -o dist --interpreter python
      - name: Verify wheel ABI
        run: python scripts/check_wheel_abi.py "${{ matrix.python }}"
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.python }}
          path: dist
      - run: pip install -U pytest
      - run: pip install --no-index --find-links ./dist evtx
      - run: pytest

  macos:
    runs-on: macos-15
    env:
      PYO3_CROSS_PYTHON_VERSION: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14t"]
    steps:
      - uses: actions/checkout@v6
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install Rust (universal2 targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: PyO3/maturin-action@v1
        with:
          version: "1.15.0"
          command: build
          # maturin v1 uses a synthetic target triple for universal2
          args: --release --locked -o dist --interpreter python --target universal2-apple-darwin
      - name: Verify wheel ABI
        run: python scripts/check_wheel_abi.py "${{ matrix.python }}"
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.python }}
          path: dist
      - run: pip install -U pytest
      - run: pip install --no-index --find-links ./dist evtx
      - run: pytest

  macos-aarch64:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14t"]
    steps:
      - uses: actions/checkout@v6
      - name: Checkout Rust EVTX (for samples)
        uses: actions/checkout@v6
        with:
          repository: omerbenamram/evtx
          path: evtx-rs
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build instrumentation wheels
        uses: PyO3/maturin-action@v1
        with:
          version: "1.15.0"
          manylinux: auto
          command: build
          args: --release --locked -o dist --interpreter python
        env:
          RUSTFLAGS: "-Cprofile-generate=${{ github.workspace }}/pgo-data"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: aarch64-apple-darwin
          components: llvm-tools
      - name: Install Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: PGO optimize
        run: |
          PATH=$HOME/.rustup/toolchains/stable-aarch64-apple-darwin/lib/rustlib/aarch64-apple-darwin/bin/:$PATH
          pip install --no-index --find-links ./dist evtx
          echo "Running instrumented binary"
          sudo mkdir -p $PWD/pgo-data
          sudo chmod -R 777 $PWD/pgo-data
          for i in $(find $PWD/evtx-rs/samples -name "*.evtx"); do
              echo "Processing $i"
              python scripts/evtx_dump.py $i 1>/dev/null
          done
          echo "Merging profile data"
          llvm-profdata merge -o $PWD/pgo-data/merged.profdata $PWD/pgo-data
      - name: Build Optimized Wheels
        uses: PyO3/maturin-action@v1
        with:
          version: "1.15.0"
          command: build
          args: --release --locked -o dist --interpreter python
        env:
          RUSTFLAGS: "-Cprofile-use=${{ github.workspace }}/pgo-data/merged.profdata"
      - name: Verify wheel ABI
        run: python scripts/check_wheel_abi.py "${{ matrix.python }}"
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-aarch64-${{ matrix.python }}
          path: dist
      - run: pip install -U pytest
      - run: pip install --no-index --find-links ./dist evtx
      - run: pytest

  release:
    name: Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      [
        macos,
        windows,
        linux,
        macos-aarch64,
        linux-arm64,
        linux-aarch64-musl,
        linux-x86_64-musl,
      ]
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: wheels
          pattern: wheels-*
          merge-multiple: true
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish --check-url https://pypi.org/simple/ ./wheels/*.whl
