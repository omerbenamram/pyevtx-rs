name: CI

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  pull_request:
  # auto-tag.yml dispatches this on the tag it pushes (its tag push doesn't trigger workflows).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-notes:
    name: Check release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check CHANGELOG.md has notes for the Cargo.toml version
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          scripts/release-notes.sh "$VERSION" > /dev/null

  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14t"]
    steps:
      - uses: actions/checkout@v6
      - name: Checkout Rust EVTX (for samples)
        uses: actions/checkout@v6
        with:
          repository: omerbenamram/evtx
          path: evtx-rs
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build instrumentation wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: "v1.15.0"
          manylinux: auto
          command: build
          # Its own directory: `dist` is what is tested and published.
          args: --release --locked -o dist-instrumented --interpreter python${{ matrix.python }}
        env:
          RUSTFLAGS: "-Cprofile-generate=${{ github.workspace }}/pgo-data"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-unknown-linux-gnu
          components: llvm-tools
      - name: PGO optimize
        run: |
          PATH=$HOME/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/x86_64-unknown-linux-gnu/bin/:$PATH
          pip install --no-index --find-links ./dist-instrumented evtx
          echo "Running instrumented binary"
          sudo mkdir -p $PWD/pgo-data
          sudo chmod -R 777 $PWD/pgo-data
          for i in $(find $PWD/evtx-rs/samples -name "*.evtx"); do
              echo "Processing $i"
              python scripts/evtx_dump.py $i 1>/dev/null
          done
          echo "Merging profile data"
          llvm-profdata merge -o $PWD/pgo-data/merged.profdata $PWD/pgo-data
          # The optimized wheel has the same version, which pip would leave in place.
          pip uninstall -y evtx
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: "v1.15.0"
          manylinux: auto
          command: build
          args: --release --locked -o dist --interpreter python${{ matrix.python }}
        env:
          RUSTFLAGS: "-Cprofile-use=${{ github.workspace }}/pgo-data/merged.profdata"
      - name: Verify wheel ABI
        run: python scripts/check_wheel_abi.py "${{ matrix.python }}"
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.python }}
          path: dist
