[build-system]
# 1.14 finds free-threaded interpreters and understands PyO3 0.29+ abi3t;
# 1.15 fixes the abi3t module entrypoint check.
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
module-name = "evtx._native"
# Every maturin build keeps Cargo.lock as committed, and fails when it does not fit Cargo.toml.
locked = true
# The sdist holds what a build and its tests need: not the repository's own tooling, nor
# `rust-toolchain`, which would have rustup fetch a toolchain on the machine that builds.
exclude = [
    { path = ".github/**", format = "sdist" },
    { path = ".claude/**", format = "sdist" },
    { path = "AGENTS.md", format = "sdist" },
    { path = "CLAUDE.md", format = "sdist" },
    { path = ".zed/**", format = "sdist" },
    { path = ".dockerignore", format = "sdist" },
    { path = ".gitignore", format = "sdist" },
    { path = "notebooks/**", format = "sdist" },
    { path = "build_pgo.sh", format = "sdist" },
    { path = "RELEASING.md", format = "sdist" },
    { path = "Makefile", format = "sdist" },
    { path = "rust-toolchain", format = "sdist" },
    { path = "uv.lock", format = "sdist" },
]

[project]
name = "evtx"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python",
    "Programming Language :: Rust",
]

[project.optional-dependencies]
test = ["pytest"]
dev = ["jupyter", "maturin>=1.15,<2.0"]

[dependency-groups]
dev = [
    "pytest",
    "mypy>=1.18,<3",
    "maturin>=1.15,<2.0",
    "pefile>=2024.8.26",
]
